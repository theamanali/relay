name: Client (macOS)

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "docs/PROTOCOL.md"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - "docs/PROTOCOL.md"
      - ".github/workflows/client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} — arm64 build, test, bundle
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      # swift-tools-version 6.2 and .macOS(.v26) need Xcode 26+. If a runner
      # defaults to an older Xcode, the minimum-OS job keeps that OS and only
      # swaps the toolchain.
      - name: Select Xcode 26 or later
        run: |
          major=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "$major" -lt 26 ]; then
            latest=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_(2[6-9]|[3-9][0-9])' | sort -V | tail -1)
            test -n "$latest"
            sudo xcode-select -s "$latest"
          fi

      - name: Toolchain
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Pairing integration (isolated state)
        run: ./Tools/test-pair-name.sh

      - name: Release bundle and signature
        run: |
          ./bundle.sh
          test "$(lipo -archs Relay.app/Contents/MacOS/Relay)" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' Relay.app/Contents/Info.plist)" = 26.0
          codesign --verify --deep --strict Relay.app
          test "$(xcrun vtool -show-build Relay.app/Contents/MacOS/Relay | awk '/minos/{print $2}')" = 26.0
          test "$(xcrun vtool -show-build Relay.app/Contents/MacOS/Relay | awk '/sdk /{print $2}')" = "$(xcrun --sdk macosx --show-sdk-version)"
