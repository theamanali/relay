name: Client (macOS)

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "docs/PROTOCOL.md"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - "docs/PROTOCOL.md"
      - ".github/workflows/client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
