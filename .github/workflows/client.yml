name: Client (macOS)

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "docs/PROTOCOL.md"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - "docs/PROTOCOL.md"
      - ".github/workflows/client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} — arm64 build, test, bundle
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Pairing integration (isolated state)
        run: ./Tools/test-pair-name.sh

      - name: Release bundle and signature
        run: |
          ./bundle.sh
          test "$(lipo -archs Relay.app/Contents/MacOS/Relay)" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' Relay.app/Contents/Info.plist)" = 14.0
          codesign --verify --deep --strict Relay.app
          test "$(xcrun vtool -show-build Relay.app/Contents/MacOS/Relay | awk '/minos/{print $2}')" = 14.0
          test "$(xcrun vtool -show-build Relay.app/Contents/MacOS/Relay | awk '/sdk /{print $2}')" = "$(xcrun --sdk macosx --show-sdk-version)"
