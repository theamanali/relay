[package]
name = "relay-host"
version = "0.1.0"
edition = "2021"
description = "Windows host: turns a connected client into a virtual monitor over a direct network link"
license = "MIT"
publish = false

[lib]
name = "relay_host"
path = "src/lib.rs"

[[bin]]
name = "relay-host"
path = "src/main.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
mdns-sd = "0.11"
socket2 = { version = "0.5", features = ["all"] }
regex = "1"
winreg = "0.55"
ctrlc = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
hmac = "0.12"
# The default resolver with just this suite's primitives: snow's std feature
# would also build ring (and the defaults AES-GCM and BLAKE2), none of which
# Noise_XX_25519_ChaChaPoly_SHA256 uses.
snow = { version = "0.10", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
rand = "0.8"
hex = "0.4"
if-addrs = "0.13"
windows-service = "0.8"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Environment",
    "Win32_UI_Shell",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Media",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Services",
    "Wdk_Graphics_Direct3D",
    "Win32_Devices_Display",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "browse"
path = "src/bin/browse.rs"
